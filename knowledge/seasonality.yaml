# Сезонность спроса: индекс по месяцам (1.0 — обычный месяц).
#
# ⚠️ ЭКСПЕРТНАЯ ОЦЕНКА, НЕ ДАННЫЕ. Истории продаж за прошлый год у агента нет,
# поэтому профили ниже — типичная картина категорий на маркетплейсах РФ.
# На реальном кабинете их нужно заменить отношениями своих продаж прошлого
# года по месяцам (продажи месяца / среднемесячные продажи за год). Формат
# тот же, код менять не нужно.
#
# Как используется: темп продаж последних 30 дней очищается от сезона
# (делится на индекс этих дней) и переносится на будущий период (умножается
# на индекс будущих дней). Так план поставок и производства видит пик заранее,
# а не узнаёт о нём, когда товар уже кончился.

version: 1

profiles:
  # Подарочная категория: Новый год, 14 и 23 февраля, 8 Марта.
  perfume:
    title: "Парфюмерия"
    months: [0.8, 1.4, 1.5, 0.9, 0.9, 0.8, 0.8, 0.9, 1.0, 1.1, 1.5, 2.3]

  # Декоративная косметика: праздники и подарочные наборы, слабое лето.
  makeup:
    title: "Декоративная косметика"
    months: [0.9, 1.1, 1.2, 1.0, 1.0, 0.9, 0.9, 0.95, 1.0, 1.0, 1.2, 1.5]

  # Уход: ровный спрос, умеренный рост к зиме и распродажам ноября.
  skincare:
    title: "Уход за лицом"
    months: [1.0, 1.0, 1.05, 1.05, 1.0, 0.95, 0.95, 0.95, 1.0, 1.05, 1.2, 1.3]

  # Солнцезащита: пик весна-лето, провал зимой.
  spf:
    title: "Солнцезащитные средства"
    months: [0.6, 0.7, 0.9, 1.2, 1.5, 1.7, 1.7, 1.3, 0.9, 0.7, 0.6, 0.6]

# Категория товара → профиль.
categories:
  "Парфюмерия": perfume
  "Декоративная косметика": makeup
  "Уход за лицом": skincare

# Товары, чей спрос живёт не по сезону своей категории.
products:
  AVL-CRM-DAY-50: spf
